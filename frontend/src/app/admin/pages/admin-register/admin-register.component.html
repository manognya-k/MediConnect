<div class="login-shell">

  <!-- Left branding panel -->
  <div class="login-brand">
    <div class="brand-content">
      <div class="panel-brand">
        <img src="assets/logo.svg" alt="MediConnect Logo" class="panel-logo" />
        <p class="panel-tagline">Connecting care.<br>Improving lives.</p>
        <div class="panel-features">
          <div class="panel-feat-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M20 6L9 17l-5-5" stroke="white" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Real-time hospital network monitoring</span>
          </div>
          <div class="panel-feat-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M20 6L9 17l-5-5" stroke="white" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>AI-powered operational insights</span>
          </div>
          <div class="panel-feat-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M20 6L9 17l-5-5" stroke="white" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Multi-branch administration &amp; analytics</span>
          </div>
        </div>
      </div>
    </div>
    <div class="brand-glow brand-glow-1"></div>
    <div class="brand-glow brand-glow-2"></div>
  </div>

  <!-- Right form panel -->
  <div class="login-form-panel">
    <div class="form-card">

      <div class="form-logo">
        <div class="form-mark">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M8 2v12M2 8h12" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <h1 class="form-title">Create Admin Account</h1>
      <p class="form-sub">Register as an authorised administrator.</p>

      <!-- Error banner -->
      <div *ngIf="errorMsg" class="error-banner">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="6" stroke="#EF4444" stroke-width="1.5"/>
          <path d="M8 5v4" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="8" cy="11" r=".75" fill="#EF4444"/>
        </svg>
        {{ errorMsg }}
      </div>

      <!-- Success banner -->
      <div *ngIf="successMsg" class="success-banner">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="6" stroke="#10B981" stroke-width="1.5"/>
          <path d="M5 8l2 2 4-4" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        {{ successMsg }}
      </div>

      <!-- 1. Hospital -->
      <div class="field">
        <label class="field-label">Hospital *</label>
        <select class="field-input field-select"
                [(ngModel)]="selectedHospitalId"
                [disabled]="isLoading || hospitalsLoading">
          <option [ngValue]="null" disabled>
            {{ hospitalsLoading ? 'Loading hospitals…' : 'Select hospital' }}
          </option>
          <option *ngFor="let h of hospitals" [ngValue]="h.hospitalId">
            {{ h.hospitalName }} <ng-container *ngIf="h.emailCode">({{ h.emailCode }})</ng-container>
          </option>
        </select>
      </div>

      <!-- 2 & 3. First + Last Name -->
      <div class="field-row">
        <div class="field">
          <label class="field-label">First Name *</label>
          <input class="field-input"
                 type="text"
                 placeholder="First name"
                 [(ngModel)]="firstName"
                 [disabled]="isLoading"
                 (keydown)="onKeydown($event)"/>
        </div>
        <div class="field">
          <label class="field-label">Last Name *</label>
          <input class="field-input"
                 type="text"
                 placeholder="Last name"
                 [(ngModel)]="lastName"
                 [disabled]="isLoading"
                 (keydown)="onKeydown($event)"/>
        </div>
      </div>

      <!-- 4. Email -->
      <div class="field">
        <label class="field-label">
          Email address *
          <span *ngIf="emailHint" class="field-hint">— {{ emailHint }}</span>
        </label>
        <input class="field-input"
               type="email"
               [placeholder]="emailPlaceholder"
               [(ngModel)]="email"
               [disabled]="isLoading || !selectedHospitalId"
               (keydown)="onKeydown($event)"/>
      </div>

      <!-- 5. Phone -->
      <div class="field">
        <label class="field-label">Phone Number *</label>
        <input class="field-input"
               type="tel"
               placeholder="e.g. 9876543210"
               [(ngModel)]="phone"
               [disabled]="isLoading"
               (keydown)="onKeydown($event)"/>
      </div>

      <!-- 6. Password -->
      <div class="field">
        <label class="field-label">Password *</label>
        <div class="pw-wrap">
          <input class="field-input"
                 [type]="showPw ? 'text' : 'password'"
                 placeholder="Min. 6 characters"
                 [(ngModel)]="password"
                 [disabled]="isLoading"
                 (keydown)="onKeydown($event)"/>
          <button class="pw-toggle" type="button" (click)="showPw = !showPw">
            <svg *ngIf="!showPw" width="14" height="14" viewBox="0 0 16 16" fill="none">
              <path d="M1 8C2.5 5 5 3 8 3s5.5 2 7 5c-1.5 3-4 5-7 5S2.5 11 1 8z" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <svg *ngIf="showPw" width="14" height="14" viewBox="0 0 16 16" fill="none">
              <path d="M2 2l12 12M6.5 6.8A2 2 0 009.2 9.5M4.5 4.7C2.9 5.7 1.7 6.9 1 8c1.5 3 4 5 7 5 1.2 0 2.3-.3 3.3-.8M6 3.4C6.6 3.1 7.3 3 8 3c3 0 5.5 2 7 5-.5 1-1.2 2-2.1 2.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- 7. Confirm Password -->
      <div class="field">
        <label class="field-label">Confirm Password *</label>
        <div class="pw-wrap">
          <input class="field-input"
                 [type]="showConfirmPw ? 'text' : 'password'"
                 placeholder="Re-enter password"
                 [(ngModel)]="confirmPw"
                 [disabled]="isLoading"
                 (keydown)="onKeydown($event)"/>
          <button class="pw-toggle" type="button" (click)="showConfirmPw = !showConfirmPw">
            <svg *ngIf="!showConfirmPw" width="14" height="14" viewBox="0 0 16 16" fill="none">
              <path d="M1 8C2.5 5 5 3 8 3s5.5 2 7 5c-1.5 3-4 5-7 5S2.5 11 1 8z" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <svg *ngIf="showConfirmPw" width="14" height="14" viewBox="0 0 16 16" fill="none">
              <path d="M2 2l12 12M6.5 6.8A2 2 0 009.2 9.5M4.5 4.7C2.9 5.7 1.7 6.9 1 8c1.5 3 4 5 7 5 1.2 0 2.3-.3 3.3-.8M6 3.4C6.6 3.1 7.3 3 8 3c3 0 5.5 2 7 5-.5 1-1.2 2-2.1 2.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- 8. Terms -->
      <div class="field field-check">
        <label class="check-label">
          <input type="checkbox" [(ngModel)]="agreeTerms" [disabled]="isLoading"/>
          <span>I agree to the terms of service and privacy policy</span>
        </label>
      </div>

      <!-- 9. Register button -->
      <button class="submit-btn"
              [class.loading]="isLoading"
              [disabled]="isLoading"
              (click)="submit()">
        <span *ngIf="!isLoading">Create Admin Account</span>
        <span *ngIf="isLoading" class="spinner-row">
          <span class="spinner"></span>
          Creating account…
        </span>
      </button>

      <p class="hint-text">
        Already have an account?
        <a routerLink="/admin/login" class="hint-link">Sign in</a>
      </p>

    </div>
  </div>

</div>
