spring.application.name=hospital-management

# ── Database ─────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mediconnect}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── HikariCP — keep pool small to fit Railway memory ─────────────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# ── JPA / Hibernate ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# SQL logging OFF in production — these are major memory bloat under load
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Tomcat — smaller thread pool for low-memory container ────────
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5

# ── Jackson date serialization — emit ISO-8601 strings ───────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false

server.port=${PORT:8081}

# ── JWT — set JWT_SECRET env var in production (>= 32 chars) ─────
jwt.secret=${JWT_SECRET:mediconnect-dev-only-secret-key-CHANGE-IN-PRODUCTION-32+chars}
jwt.expiration=86400000

# ── External APIs — required env vars in production ──────────────
# Set GEMINI_API_KEY in Railway → Variables. No default = endpoint
# returns "AI service is not configured" if missing (safe fallback).
gemini.api.key=${GEMINI_API_KEY:}

# Legacy — no longer used
anthropic.api.key=${ANTHROPIC_API_KEY:}

# ── Billing fees ─────────────────────────────────────────────────
mediconnect.billing.consult-fee=500
mediconnect.billing.video-consult-fee=700
