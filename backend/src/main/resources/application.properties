spring.application.name=hospital-management
spring.datasource.url=jdbc:mysql://localhost:3306/mediconnect
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Ctschn@372}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
server.port=8081

# JWT — override JWT_SECRET in production with a long random string (>= 32 chars)
jwt.secret=${JWT_SECRET:mediconnect-dev-only-secret-key-CHANGE-IN-PRODUCTION-32+chars}
jwt.expiration=86400000

# Anthropic Claude API key — set ANTHROPIC_API_KEY env var
anthropic.api.key=${ANTHROPIC_API_KEY:}
