spring.application.name=hospital-management
spring.datasource.url=jdbc:mysql://localhost:3306/mediconnect
#spring.datasource.url=jdbc:mysql://root:YOVUtAZvZJfLqvWtxsASnDaIrCKMeqMU@mysql.railway.internal:3306/railway
spring.datasource.username=${DB_USERNAME:root}
#spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
#spring.datasource.password=YOVUtAZvZJfLqvWtxsASnDaIrCKMeqMU
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Jackson date serialization — emit ISO-8601 strings instead of numeric arrays
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false
server.port=8081

# JWT — override JWT_SECRET in production with a long random string (>= 32 chars)
jwt.secret=${JWT_SECRET:mediconnect-dev-only-secret-key-CHANGE-IN-PRODUCTION-32+chars}
jwt.expiration=86400000

# Anthropic Claude API key — set ANTHROPIC_API_KEY env var (legacy, no longer used)
anthropic.api.key=${ANTHROPIC_API_KEY:}

# Google Gemini API key — set GEMINI_API_KEY env var or override here
# Model used: gemini-2.5-flash
gemini.api.key=${GEMINI_API_KEY:AIzaSyBoT9_k_qTv9XEzL_cQkfanHQumnBRh65c}

# Billing fees — override in production
mediconnect.billing.consult-fee=500
mediconnect.billing.video-consult-fee=700
