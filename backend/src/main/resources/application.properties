spring.application.name=hospital-management
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mediconnect}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
server.port=${PORT:8081}

# JWT — override JWT_SECRET in production with a long random string (>= 32 chars)
jwt.secret=${JWT_SECRET:mediconnect-dev-only-secret-key-CHANGE-IN-PRODUCTION-32+chars}
jwt.expiration=86400000

# Anthropic Claude API key — set ANTHROPIC_API_KEY env var (legacy, no longer used)
anthropic.api.key=${ANTHROPIC_API_KEY:}

# Google Gemini API key — set GEMINI_API_KEY env var or override here
# Model used: gemini-flash-latest (maps to gemini-3-flash-preview, highest quota availability)
gemini.api.key=${GEMINI_API_KEY:AIzaSyA86fmg4ZOIF-CjZz8j6KIKc64CabbQPW4}

# Billing fees — override in production
mediconnect.billing.consult-fee=500
mediconnect.billing.video-consult-fee=700
