spring.application.name=hospital-management

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mediconnect}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# Tomcat — smaller thread pool for low-memory container
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5

# Jackson date serialization — emit ISO-8601 strings instead of numeric arrays
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false

server.port=${PORT:8081}

# JWT — override JWT_SECRET in production with a long random string (>= 32 chars)
jwt.secret=${JWT_SECRET:mediconnect-dev-only-secret-key-CHANGE-IN-PRODUCTION-32+chars}
jwt.expiration=86400000

# Anthropic Claude API key — set ANTHROPIC_API_KEY env var (legacy, no longer used)
anthropic.api.key=${ANTHROPIC_API_KEY:}

# Google Gemini API key — set GEMINI_API_KEY env var or override here
# Model used: gemini-2.5-flash
gemini.api.key=${GEMINI_API_KEY:}

# Billing fees — override in production
mediconnect.billing.consult-fee=500
mediconnect.billing.video-consult-fee=700
